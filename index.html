<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chiusura turno</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px));background:#c9cac5;font:13px/1.3 Arial,Helvetica,sans-serif;color:#222}
button,.btn{min-height:44px;padding:0 14px;font:700 15px Arial,sans-serif;border:1px solid #888;border-radius:8px;background:#fff;color:#111;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.p{background:#1d3fb0;border-color:#1d3fb0;color:#fff}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:760px;margin:0 auto;padding:8px 10px}
.hint{flex:1 1 100%;margin:0;font-size:12px}
#st{flex:1 1 120px;text-align:right;font-weight:700;font-size:12px}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #999}
.bot button{flex:1;padding:0 6px}
#ms{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:max-content;max-width:92%;padding:10px 14px;border-radius:8px;background:#222;color:#fff;font-size:14px;text-align:center}
#ms:empty{display:none}
#md{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;background:rgba(0,0,0,.55)}
#md[hidden]{display:none}
.box{width:100%;max-width:560px;padding:14px;border-radius:10px;background:#fff;color:#111;font-size:14px}
.box h3{margin:0 0 10px}
.box label{display:block;margin:8px 0 2px}
.box input,.box select{width:100%;min-height:44px;padding:0 8px;font:16px Arial,sans-serif;border:1px solid #888;border-radius:6px}
.box button,.box .btn{width:100%;margin-top:8px}
#doc{max-width:760px;margin:0 auto;background:#fff}
.sheet{padding:16px}
.sheet+.sheet{border-top:2px dashed #999}
.r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:8px 0}
.r b{font-weight:400;font-size:12px;white-space:nowrap}
.r small{font-size:11px;white-space:nowrap}
.g{display:flex;align-items:baseline;gap:4px;flex:2 1 150px}
.paper input,.paper textarea{flex:1 1 56px;width:100%;min-width:0;margin:0;padding:0 2px;border:0;border-bottom:1px solid #666;border-radius:0;background:transparent;outline:0;text-align:center;font:600 21px/1.1 Caveat,"Segoe Print",cursive;color:#111}
.paper textarea{flex:1 1 100%;text-align:left;border:1px solid #666;resize:none;height:60px}
.paper textarea::placeholder{font:400 10px Arial;color:#777}
.paper input:focus,.paper textarea:focus{background:#fff6c8}
.paper input.a{color:#1d3fb0}.paper input.neg{color:#c0262d}
.paper input.t{text-align:left;flex:3 1 120px}
.paper input.w{flex:none;width:92px}
.paper td input{border:0}
.cb{display:inline-block;width:18px;height:18px;border:1px solid #444;text-align:center;font:700 15px/16px Arial;vertical-align:-4px;margin:0 2px 0 6px;cursor:pointer}
.ttl{text-align:center;font-weight:700;letter-spacing:2px;margin:14px 0 4px}
.pg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #666}
.pg>div{padding:2px 6px 6px}.pg>div+div{border-left:1px solid #666}
.pg .r{margin:4px 0}.paper .pg .r input:first-child{flex:0 0 64px}
table{border-collapse:collapse;width:100%;table-layout:fixed;margin-top:10px}
th,td{border:1px solid #666;padding:2px;font-size:11px;font-weight:400;text-align:center;height:34px}
td.l{text-align:left;padding-left:5px;font-size:12px}
th.v{width:30px}
.v span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;letter-spacing:1px}
.dg{background:linear-gradient(to top right,transparent 49.3%,#555 49.3%,#555 50.7%,transparent 50.7%)}
.h{font:600 23px Caveat,cursive;color:#1d3fb0;margin-right:14px}
@media(max-width:480px){.sheet{padding:12px 8px}.r b{font-size:11px}.paper input{font-size:19px}.paper input.w{width:74px}}
</style>
</head>
<body>
<div class="top"><button id="hs">Storico</button><button id="cf">⚙ Archivio</button><small id="st"></small><p class="hint">Blu = calcolato da solo. Le somme si scrivono come sulla carta: 72,70+54,90</p></div>
<div id="doc" class="paper"></div>
<div class="bot"><button class="p" id="sv">Salva</button><button id="im">Immagine</button><button id="nw">Nuovo turno</button></div>
<div id="ms"></div>
<div id="md" hidden></div>
<script>
const D=document,$=s=>D.querySelector(s),E={},S={1:"Notte",2:"Mattina",3:"Pomeriggio"};
const G=[["gv","GRATTA E VINCI"],["si","SISAL"],["mo","MOONEY"],["lo","LOTTO"],["li","LIS"],["sr","SIR"],["be","BETTER"]];
const T=[[30,"30 €"],[20,"20 €"],[10,"10 €"],[5,"5 €"],[3,"3 €"],[2,"2 €"],[1,"1 €"],[0,"LOTT"]];
const K=[["BIT 1,50€",1.5],["GIORNALIERO 3,50€",3.5],["TESSERE ATAC 3€",3],["COTRAL 0,80€",.8],["COTRAL 1,00€",1],["COTRAL 1,30€",1.3],["COTRAL 2,20€",2.2],["COTRAL 2,80€",2.8],["TESSERE COTRAL 59,50€",59.5],["TESSERE COTRAL 73,50€",73.5]];
const R=["MARCA DA BOLLO","MARCA CAMBIALI","MARCA PASSAPORTO","CONTR. UNIFICATO","MARCA SERVIZI","CONTR. UNIFICATO TRIB."];
const I=(k,o="")=>`<input data-k="${k}" autocomplete="off"${/[tx]/.test(o)?"":' inputmode="decimal"'} class="${o.includes("t")?"t":""}${o.includes("w")?" w":""}">`;
const O=k=>`<input data-c="${k}" autocomplete="off" inputmode="decimal">`;
const cb=(v,l)=>`<span class="cb" data-v="${v}"></span><b>${l}</b>`;
const pc=(a,t,x="")=>`<div>${a.map(i=>`<div class="r">${I("pa"+i)}${I("pd"+i,"t")}</div>`).join("")}<div class="r"><b>TOT. PAG.TI</b>${O(t)}</div>${x}</div>`;
const s1=`<section class="sheet">
<div class="r"><b>CHIUSURA DEL</b>${I("dt","tw")}<b>TURNO</b>${cb(1,"21:00-05:00")}${cb(2,"05:00-13:00")}${cb(3,"13:00-21:00")}<input type="hidden" data-k="sh"></div>
<div class="r"><b>CASSIERE:</b>${I("ca","t")}</div>
<div class="r"><b>CONTANTI:</b>${I("co")}</div>
<div class="r"><b>REFIL</b>${I("rl")}<b>TOT:</b>${I("rt")}</div>
<div class="r"><b>POS BAR iniz.</b>${I("bi")}<b>final</b>${I("bf","x")}<b>POS:</b>${O("bp")}</div>
<div class="r"><b>POS TAB iniz.</b>${I("ti")}<b>final</b>${I("tf","x")}<b>POS:</b>${O("tp")}<b>TOTALE POS</b>${O("tt")}</div>
${G.map(([k,n])=>`<div class="r"><b>${n}:</b>${O(k+"a")}<span class="g"><small>(${k=="gv"?"vincite iniziale":"valore iniziale"}</small>${I(k+"i")}<small>)</small></span><span class="g"><small>(valore Finale</small>${I(k+"f","x")}<small>)</small></span></div>`).join("")}
<div class="ttl">PAGAMENTI</div>
<div class="pg">${pc([0,1,2,3],"ptl")}${pc([4,5,6,7],"ptr",'<textarea data-k="sp" placeholder="SCRIVI QUI LE SPESE UFFICIO"></textarea>')}</div>
<table><tr><th class="v" rowspan="10"><span>GRATTA &amp; VINCI</span></th><th>TAGLIO</th><th>INIZIO</th><th>FINE</th><th>VENDUTO TOTALE</th><th>IMPORTO VENDUTO</th><th>VINCITE</th><th>NETTO</th></tr>
${T.map(([p,l],i)=>`<tr><td>${l}</td><td>${I("gi"+i)}</td><td>${I("gf"+i)}</td><td>${O("gs"+i)}</td><td>${p?O("gm"+i):I("gm"+i)}</td>${i?"":'<td class="dg" rowspan="8"></td><td class="dg" rowspan="8"></td>'}</tr>`).join("")}
<tr><td colspan="4">TOTALI</td><td>${O("gmt")}</td><td>${O("gvt")}</td><td>${O("gnt")}</td></tr></table></section>`;
const s2=`<section class="sheet">
<div class="r"><span class="h" data-m="ca"></span><span class="h" data-m="dt"></span><span class="h" data-m="sl"></span></div>
<table><tr><th style="width:38%"></th><th>VENDUTI</th><th>INIZIALE</th><th>FINALE</th><th>IMPORTO</th></tr>
${K.map(([l],i)=>`<tr><td class="l">${l}</td><td>${O("ks"+i)}</td><td>${I("ki"+i)}</td><td>${I("kf"+i)}</td><td>${O("kt"+i)}</td></tr>`).join("")}
<tr><td colspan="4" class="l">TOTALE BIGLIETTI</td><td>${O("ktt")}</td></tr></table>
<table><tr><th style="width:38%"></th><th>INIZIALE</th><th>RICARICHE</th><th>FINALE</th></tr>
${R.map((l,i)=>`<tr><td class="l">${l}</td><td>${I("ri"+i)}</td><td>${I("rr"+i)}</td><td>${I("rf"+i)}</td></tr>`).join("")}</table>
<div class="r" style="margin-top:14px"><b>NOTE:</b><textarea data-k="no"></textarea></div></section>`;
$("#doc").innerHTML=s1+s2;
D.querySelectorAll("[data-k],[data-c]").forEach(e=>E[e.dataset.k||e.dataset.c]=e);

/* ---- calcoli ---- */
const ev=s=>{const m=String(s).replace(/,/g,".").match(/[+-]?\s*\d*\.?\d+/g);return m?m.reduce((a,x)=>a+parseFloat(x.replace(/\s/g,"")),0):null};
const n=k=>E[k]?ev(E[k].value):null;
const fm=x=>x==null||isNaN(x)?"":String(Math.round(x*100)/100).replace(".",",");
const sum=(...a)=>a.some(x=>x!=null)?a.reduce((s,x)=>s+(x||0),0):null;
const sub=(a,b)=>a!=null&&b!=null?a-b:null;
const mul=(a,b)=>a!=null&&b!=null?a*b:null;
const lt=s=>{const m=String(s).replace(/,/g,".").match(/\d*\.?\d+/g),x=m?+m[m.length-1]:0;return x?fm(x):""};
const td=()=>{const d=new Date();return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)};
const C={};
C.bp=()=>n("bf");C.tp=()=>n("tf");C.tt=()=>sum(n("bp"),n("tp"));
G.forEach(([k])=>C[k+"a"]=()=>n(k+"f"));
T.forEach(([p],i)=>{C["gs"+i]=()=>sub(n("gi"+i),n("gf"+i));if(p)C["gm"+i]=()=>mul(n("gs"+i),p)});
C.gmt=()=>sum(...T.map((_,i)=>n("gm"+i)));C.gvt=()=>n("gva");C.gnt=()=>sub(n("gmt"),n("gvt"));
C.ptl=()=>sum(...[0,1,2,3].map(i=>n("pa"+i)));C.ptr=()=>sum(...[4,5,6,7].map(i=>n("pa"+i)));
K.forEach(([,p],i)=>{C["ks"+i]=()=>sub(n("ki"+i),n("kf"+i));C["kt"+i]=()=>mul(n("ks"+i),p)});
C.ktt=()=>sum(...K.map((_,i)=>n("kt"+i)));
function calc(){
 for(const k in C){const e=E[k];if(!e||e.dataset.o)continue;const r=C[k]();e.value=fm(r);e.classList.toggle("a",r!=null);e.classList.toggle("neg",r<0)}
 D.querySelectorAll("[data-m]").forEach(e=>e.textContent=e.dataset.m=="sl"?(S[E.sh.value]||"").toUpperCase():E[e.dataset.m].value);
 D.querySelectorAll(".cb").forEach(e=>e.textContent=E.sh.value==e.dataset.v?"✕":"");
}
function reset(){Object.values(E).forEach(e=>{e.value="";delete e.dataset.o;e.classList.remove("a","neg")});E.dt.value=td()}

/* ---- stato locale ---- */
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(x){return null}};
const cfg=()=>{try{return JSON.parse(ls("ghcfg"))}catch(x){return null}};
let dirty=ls("ct1d")=="1";
const st=()=>$("#st").textContent=!cfg()?"Archivio non collegato":dirty?"● Da salvare":"✓ Salvato su GitHub";
const setD=v=>{dirty=v;ls("ct1d",v?"1":"0");st()};
const payload=()=>({v:1,salvato:new Date().toISOString(),data:E.dt.value,turno:S[E.sh.value]||"",cassiere:E.ca.value,
 riepilogo:{contanti:n("co"),totale_pos:n("tt"),gratta_vinci_venduto:n("gmt"),gratta_vinci_vincite:n("gvt"),gratta_vinci_netto:n("gnt"),pagamenti:sum(n("ptl"),n("ptr")),biglietti:n("ktt")},
 campi:Object.fromEntries(Object.entries(E).filter(([,e])=>e.value!=="").map(([k,e])=>[k,e.value])),
 manuali:Object.keys(E).filter(k=>E[k].dataset.o)});
const saveL=()=>ls("ct1",JSON.stringify(payload()));
function applica(p){reset();const f=p.campi||{};for(const k in f)if(E[k])E[k].value=f[k];(p.manuali||[]).forEach(k=>{if(E[k])E[k].dataset.o=1});calc()}
function chiave(p){const m=(p.campi.dt||"").match(/\d+/g),s=p.campi.sh;if(!m||m.length<3||!S[s])return"";let[d,mo,y]=m.map(Number);if(y<100)y+=2000;if(d<1||d>31||mo<1||mo>12)return"";return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")+"_"+s}

/* ---- GitHub ---- */
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(p,o={},c=cfg()){
 const r=await fetch("https://api.github.com/repos/"+c.o+"/"+c.r+p,{...o,cache:"no-store",headers:{Authorization:"Bearer "+c.t,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
 if(!r.ok){const e=new Error("HTTP "+r.status);e.s=r.status;throw e}
 return r.json();
}
async function put(p,c){
 const k=chiave(p),path="/contents/turni/"+k.slice(0,7)+"/"+k+".json",body=enc(JSON.stringify(p,null,1));
 for(let i=0;;i++){
  let sha;try{sha=(await gh(path,{},c)).sha}catch(e){if(e.s!=404)throw e}
  try{return await gh(path,{method:"PUT",body:JSON.stringify({message:"Turno "+k,content:body,sha})},c)}catch(e){if((e.s!=409&&e.s!=422)||i)throw e}
 }
}
const pend=()=>{try{return JSON.parse(ls("ct1q"))||[]}catch(x){return[]}};
const setP=q=>ls("ct1q",JSON.stringify(q));
async function flush(){const q=pend();if(!q.length||!cfg())return;const rest=[];for(const p of q){try{await put(p)}catch(e){rest.push(p)}}setP(rest);if(rest.length<q.length)msg("Turni in attesa salvati su GitHub ✓")}
async function archivia(){
 const c=cfg();if(!c){msg("Prima collega GitHub: tocca ⚙ Archivio");return null}
 const p=payload(),k=chiave(p);
 if(!k){msg("Scrivi la data (gg/mm/aa) e scegli il turno, poi salva");return null}
 try{await put(p,c);setP(pend().filter(x=>chiave(x)!=k));setD(false);msg("Salvato su GitHub ✓");flush();return true}
 catch(e){setP(pend().filter(x=>chiave(x)!=k).concat([p]));msg(e.s==401||e.s==403||e.s==404?"GitHub rifiuta l’accesso: controlla il token in ⚙ Archivio. Dati tenuti sul telefono.":"Nessuna connessione: dati tenuti sul telefono, riprovo più tardi.");return false}
}

/* ---- interfaccia ---- */
function msg(t){const m=$("#ms");m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent="",5500)}
function show(h){const m=$("#md");m.innerHTML='<div class="box">'+h+'<button data-a="x">Chiudi</button></div>';m.hidden=false}
const hide=()=>{$("#md").hidden=true};
function ask(b,f){if(b.dataset.q){clearTimeout(+b.dataset.q);b.textContent=b.dataset.t;delete b.dataset.q;f();return}b.dataset.t=b.textContent;b.textContent="Sicuro? Tocca di nuovo";b.dataset.q=setTimeout(()=>{b.textContent=b.dataset.t;delete b.dataset.q},3500)}
function nuovo(){
 const c={};
 ["b","t"].forEach(x=>c[x+"i"]=lt(E[x+"f"].value));
 G.forEach(([k])=>c[k+"i"]=lt(E[k+"f"].value));
 T.forEach((_,i)=>c["gi"+i]=E["gf"+i].value);
 K.forEach((_,i)=>c["ki"+i]=E["kf"+i].value);
 R.forEach((_,i)=>c["ri"+i]=E["rf"+i].value);
 c.sh=String(E.sh.value%3+1);
 reset();Object.entries(c).forEach(([k,v])=>E[k].value=v);calc();saveL();setD(false);scrollTo(0,0);msg("Nuovo turno pronto: i valori finali sono diventati iniziali");
}
function cfgUI(){
 const c=cfg()||{};
 show('<h3>Archivio GitHub</h3><label>Utente GitHub</label><input id="g_o" value="'+(c.o||"")+'" autocapitalize="off" autocomplete="off"><label>Repository dei dati (privato)</label><input id="g_r" value="'+(c.r||"")+'" autocapitalize="off" autocomplete="off"><label>Token</label><input id="g_t" type="password" value="'+(c.t||"")+'" autocomplete="off"><button class="p" data-a="cv">Verifica e salva</button><button data-a="cl">Copia link di configurazione</button><input id="lk" readonly hidden><button data-a="cd">Rimuovi il collegamento da questo telefono</button><button data-a="cx">Svuota il foglio</button>');
}
async function mese(){
 const ll=$("#ll"),mm=$("#mm").value;ll.textContent="Carico…";
 try{
  const f=(await gh("/contents/turni/"+mm)).filter(x=>/_\d\.json$/.test(x.name)).map(x=>x.name).sort().reverse();
  ll.innerHTML=f.map(n=>{const [d,s]=n.replace(".json","").split("_"),[y,mo,da]=d.split("-");return'<button data-a="op" data-f="'+mm+"/"+n+'">'+da+"/"+mo+"/"+y+" · "+(S[s]||"")+"</button>"}).join("")||"Vuoto";
 }catch(x){ll.textContent="Errore di rete"}
}
async function hist(){
 if(!cfg()){msg("Prima collega GitHub");return cfgUI()}
 show("<h3>Storico turni</h3>"+(dirty?"<p>⚠ Hai modifiche non salvate: aprendo un turno verranno sostituite.</p>":"")+'<div id="hl">Carico…</div>');
 try{
  const m=(await gh("/contents/turni")).filter(x=>x.type=="dir").map(x=>x.name).sort().reverse();
  if(!m.length){$("#hl").textContent="Nessun turno salvato ancora.";return}
  $("#hl").innerHTML='<select id="mm">'+m.map(x=>"<option>"+x+"</option>").join("")+'</select><div id="ll"></div>';
  $("#mm").onchange=mese;mese();
 }catch(x){$("#hl").textContent=x.s==404?"Nessun turno salvato ancora.":"Impossibile leggere l’archivio (controlla internet e token)."}
}
async function immagine(){
 try{
  if(D.activeElement)D.activeElement.blur();
  msg("Preparo l’immagine…");
  await D.fonts.ready;
  const el=$("#doc"),c=await html2canvas(el,{scale:Math.max(1.5,Math.min(3,1200/el.offsetWidth)),backgroundColor:"#fff"});
  const b=await new Promise(r=>c.toBlob(r,"image/png")),nm="chiusura-"+(E.dt.value.replace(/\D+/g,"-")||"turno")+".png",u=URL.createObjectURL(b);
  window.PF=new File([b],nm,{type:"image/png"});
  const sh=navigator.canShare&&navigator.canShare({files:[window.PF]});
  show('<h3>Immagine pronta</h3><img src="'+u+'" style="width:100%;border:1px solid #bbb">'+(sh?'<button class="p" data-a="sh">Condividi (WhatsApp)</button>':"")+'<a class="btn" href="'+u+'" download="'+nm+'">Scarica</a>');
  msg("");
  if(cfg()&&dirty)archivia();
 }catch(x){msg("Non riesco a creare l’immagine")}
}
$("#md").onclick=async e=>{
 const b=e.target.closest("button,a"),a=b&&b.dataset.a;
 if(e.target.id=="md"||a=="x")return hide();
 if(!a)return;
 if(a=="cv"){
  const c={o:$("#g_o").value.trim(),r:$("#g_r").value.trim(),t:$("#g_t").value.trim()};
  if(!c.o||!c.r||!c.t)return msg("Compila utente, repository e token");
  try{
   const r=await gh("",{},c);
   if(!r.private)return msg("⚠ Il repository è PUBBLICO: chiunque vedrebbe i dati. Usa un repository privato.");
   ls("ghcfg",JSON.stringify(c));st();hide();msg("Collegato a GitHub ✓");flush();
  }catch(x){msg(x.s==401?"Token non valido o scaduto":x.s==404?"Repository non trovato (controlla nome e permessi del token)":"Impossibile collegarsi a GitHub")}
 }
 if(a=="cl"){
  const c=cfg();if(!c)return msg("Prima verifica e salva");
  const u=location.origin+location.pathname+"#cfg="+btoa(JSON.stringify(c)),i=$("#lk");
  i.hidden=false;i.value=u;i.select();
  try{await navigator.clipboard.writeText(u);msg("Link copiato: aprilo sull’altro telefono")}catch(x){msg("Copia il link qui sotto")}
 }
 if(a=="cd"){ls("ghcfg","");st();hide();msg("Collegamento rimosso da questo telefono")}
 if(a=="cx")ask(b,()=>{reset();calc();saveL();setD(false);hide()});
 if(a=="sh")navigator.share({files:[window.PF],title:"Chiusura turno"}).catch(()=>{});
 if(a=="op"){
  const go=async()=>{try{const f=await gh("/contents/turni/"+b.dataset.f);applica(JSON.parse(dec(f.content)));saveL();setD(false);hide();scrollTo(0,0);msg("Turno aperto")}catch(x){msg("Non riesco ad aprire il turno")}};
  dirty?ask(b,go):go();
 }
};
